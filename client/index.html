<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Nyumba 360 — Find Your Dream Property</title>
    <meta name="description" content="Nyumba 360 — Discover homes, apartments, villas, and commercial properties for sale or rent. Your trusted real estate marketplace." />
    <meta name="keywords" content="real estate, property, homes for sale, apartments for rent, villas, commercial property, Kenya real estate" />
    <meta name="author" content="Nyumba 360" />
    <meta property="og:title" content="Nyumba 360 — Find Your Dream Property" />
    <meta property="og:description" content="Discover homes, apartments, villas, and commercial properties for sale or rent on Nyumba 360." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nyumba 360" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nyumba 360" />
    <meta name="twitter:description" content="Find your dream property. Browse homes, apartments, villas, and commercial spaces." />
    <meta name="robots" content="index, follow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Nyumba 360",
      "url": "/",
      "description": "Real estate marketplace for buying, selling, and renting properties",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "/properties?location={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/client/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
